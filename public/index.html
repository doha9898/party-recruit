<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>밥풀 레기온 파티원 모집</title>

<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet">

  <style>

/* ✅ 전체 줄간격(가독성) */
body { line-height: 1.3; }

/* ✅ 방 목록 카드 안쪽은 조금 더 여유 */
.card { line-height: 1.3; }

/* ✅ 참가자 리스트 줄간격/간격 추가 */
ul.people { line-height: 1.3; }
ul.people li { margin: 4px 0; }

.roomTitle { line-height: 1.3; }

    /* ✅ 만료(시간 지난 방) 회색 처리 */
    .card.expired {
      opacity: 0.55;
      filter: grayscale(1);
    }

    /* ✅ 상태 뱃지 컬러 */
    .pill.openTag { border-color: #1e88e5; color: #1e88e5; }   /* 파란색: 모집 중 */
    .pill.closedTag { border-color: #c33; color: #c33; }       /* 빨간색: 예약 마감 */

   /* ✅ 폰트 세팅: 전체 Light / 제목 Heavy / 버튼 Bold */
body {
  font-family: "NanumSquareNeo", system-ui, -apple-system, "NanumSquareNeo", sans-serif;
  margin: 24px;
}

h1, .roomTitle, .roomTitle b {
  font-family: "NanumSquareNeoHeavy", "NanumSquareNeoExtraBold", "NanumSquareNeo", sans-serif;
}

button {
  font-family: "NanumSquareNeoBold", "NanumSquareNeo", sans-serif;
}
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { margin: 0 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 16px; margin: 12px 0; }
    .muted { color: #666; font-size: 13px; }
    .error { color: #b00020; margin-top: 8px; }
    .ok { color: #0a7a2f; margin-top: 8px; }
    .topRow { display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    .pill { font-size: 12px; border: 1px solid #ddd; border-radius: 999px; padding: 4px 10px; }
    .gridCreate { display:grid; grid-template-columns: 1.2fr 1fr 0.6fr 1fr auto; gap: 10px; align-items: center; }
    input, button, select { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; }
    button { cursor: pointer; border: 1px solid #999; background: #fff; }
    button:hover { background: #f6f6f6; }
    button.danger { border-color: #c33; }
    button.danger:hover { background: #fff3f3; }
    .roomHeader { display:flex; align-items:flex-start; justify-content:space-between; gap: 12px; }
    .roomTitle { font-size: 18px; margin: 0; }
    .roomMeta { margin-top: 4px; }
    .joinRow { display:flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .joinRow input { flex: 1; min-width: 220px; }
    ul.people { margin: 8px 0 0; padding-left: 18px; }
    .meTag { font-size: 12px; border: 1px solid #bbb; border-radius: 999px; padding: 1px 8px; margin-left: 8px; color: #333; }

    /* ✅ 모바일 반응형 */
    @media (max-width: 720px) {
      body { margin: 16px; }
      .gridCreate { grid-template-columns: 1fr; gap: 10px; }
      .gridCreate > div[style*="display:flex"] { flex-wrap: wrap; }
      .gridCreate input, .gridCreate select, .gridCreate button { width: 100%; box-sizing: border-box; }
      #date { flex: 1 1 160px; }
      #hour, #minute { flex: 1 1 90px; }
      .topRow { flex-wrap: wrap; gap: 8px; }
      .roomHeader { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><center>밥풀 레기온 파티원 모집</center></h1>

    <div id="singleRoomBar" class="card" style="display:none;">
      <div class="topRow">
        <div>
          <b>공유 링크로 들어온 방</b>
          <div class="muted">이 화면은 해당 방만 보여줘.</div>
        </div>
        <button id="goAllBtn">전체 보기</button>
      </div>
    </div>

    <div class="card">

      <div class="gridCreate">
        <input id="dungeon" placeholder="던전 이름 (예: 불신, 초월9단)" />

        <div style="display:flex; gap:10px; align-items:center;">
          <input id="date" type="date" />
          <select id="hour"></select>
          <select id="minute"></select>
        </div>

        <input id="capacity" type="number" min="2" max="20" value="4" />
        <input id="host" placeholder="닉네임/직업 (예: 도하/호법성)" />
        <button id="createBtn">파티원 모집</button>
      </div>

      <div id="createMsg"></div>
    </div>

    <div class="topRow" style="margin-top:18px;">
      <b>모집 중인 방</b>
      <div style="display:flex; gap:8px; align-items:center;">
  <span class="pill" id="statusPill">로딩...</span>
  <button id="refreshBtn" title="목록 새로고침">새로고침</button>
</div>

    </div>

    <div id="rooms"></div>
  </div>

<script>
  const NAMEJOB_KEY = "party_namejob";
  const ADMIN_KEY_LS = "ADMIN_KEY";

  const $ = (id) => document.getElementById(id);

  function loadSavedNamejob() {
    return (localStorage.getItem(NAMEJOB_KEY) || "").trim();
  }
  function saveNamejob(v) {
    const t = (v || "").trim();
    if (t) localStorage.setItem(NAMEJOB_KEY, t);
  }

  function getAdminKey() {
    return (localStorage.getItem(ADMIN_KEY_LS) || "").trim();
  }
  function setAdminKey(k) {
    const t = (k || "").trim();
    if (t) localStorage.setItem(ADMIN_KEY_LS, t);
  }

  function pad2(n){ return String(n).padStart(2,"0"); }

  function initTimePickers() {
    const hourSel = $("hour");
    const minuteSel = $("minute");

    hourSel.innerHTML = Array.from({length:24}, (_,h)=>
      `<option value="${pad2(h)}">${pad2(h)}시</option>`
    ).join("");

    const mins = [0,10,20,30,40,50].map(m => pad2(m));
    minuteSel.innerHTML = mins.map(m =>
      `<option value="${m}">${m}분</option>`
    ).join("");

    const t = new Date(Date.now() + 30*60*1000);
    let m = Math.ceil(t.getMinutes()/10)*10;
    if (m === 60) { t.setHours(t.getHours()+1); m = 0; }
    t.setMinutes(m,0,0);

    $("date").value = `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`;
    hourSel.value = pad2(t.getHours());
    minuteSel.value = pad2(t.getMinutes());
  }

  function getSelectedISO() {
    const d = $("date").value;
    const hh = $("hour").value;
    const mm = $("minute").value;
    if (!d || !hh || !mm) return null;

    const local = new Date(`${d}T${hh}:${mm}:00`);
    if (Number.isNaN(local.getTime())) return null;
    return local.toISOString();
  }

  async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    const res = await fetch(path, { ...options, headers });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const msg = (data && data.message) ? data.message : `요청 실패 (${res.status})`;
      throw new Error(msg);
    }
    return data;
  }

  async function apiDeleteWithAdmin(path) {
    const saved = getAdminKey();
    if (saved) {
      return api(path, { method: "DELETE", headers: { "x-admin-key": saved } });
    }

    const k = prompt("관리자 키를 입력하면 바로 삭제됩니다.\n(방장이면 그냥 취소 눌러도 삭제 가능합니다)");
    if (!k) {
      return api(path, { method: "DELETE" }); // 방장일 수 있으니 키 없이 시도
    }
    setAdminKey(k);
    return api(path, { method: "DELETE", headers: { "x-admin-key": k } });
  }

  function setMsg(el, type, msg) {
    el.innerHTML = msg ? `<div class="${type}">${escapeHtml(msg)}</div>` : "";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (m) => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[m]));
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      const wd = ["일","월","화","수","목","금","토"][d.getDay()];
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      return `${mm}/${dd}(${wd}) ${hh}:${mi}`;
    } catch {
      return iso;
    }
  }

  async function loadRooms() {
    const pill = $("statusPill");
    pill.textContent = "불러오는 중...";

    const match = location.pathname.match(/^\/r\/([A-Za-z0-9_-]+)$/);
    const singleId = match ? match[1] : null;

    try {
      if (singleId) {
        $("singleRoomBar").style.display = "block";
        pill.textContent = "방 1개";
        const room = await api(`/api/rooms/${singleId}`);
        renderRooms([room]);
      } else {
        $("singleRoomBar").style.display = "none";
        const rooms = await api("/api/rooms");
        pill.textContent = `방 ${rooms.length}개`;
        renderRooms(rooms);
      }
    } catch (e) {
      pill.textContent = "오류";
      $("rooms").innerHTML = `<div class="card"><div class="error">${escapeHtml(e.message)}</div></div>`;
    }
  }

  function renderRooms(rooms) {
    // ✅ 정렬: 늦은 시간 위 / 빠른 시간 아래
    rooms = [...rooms].sort((a, b) => new Date(b.time) - new Date(a.time));

    const root = $("rooms");
    if (!rooms.length) {
      root.innerHTML = `<div class="card"><div class="muted">아직 모집 방이 없어. 위에서 먼저 만들어봐!</div></div>`;
      return;
    }

    const savedNamejob = loadSavedNamejob();

    root.innerHTML = rooms.map(room => {
      const people = room.participants || [];
      const full = room.isFull;

      // ✅ 만료 판단
      const isExpired = new Date(room.time).getTime() < Date.now();

      // ✅ 상태 뱃지: 만료면 안 보임 / 만료 아니면 (예약 마감 or 모집 중)
      let statusPill = "";
      if (!isExpired) {
        statusPill = full
          ? `<span class="pill closedTag">예약 마감</span>`
          : `<span class="pill openTag">모집 중</span>`;
      }

      const shareBtn = `<button class="shareBtn" title="이 방 링크 복사">공유</button>`;
      const deleteBtn = `<button class="deleteBtn danger">삭제</button>`;

      let actionHtml = "";

      // ❌ 요구사항: "예약 마감/모집 종료" 버튼 제거
      // - 만료: 회색 처리만 하고 참가 UI 안 보여줌
      if (isExpired) {
        actionHtml = ``;
      } else if (room.isHost) {
        actionHtml = `<span class="muted">※ 방장입니다. 삭제 버튼으로 방을 내릴 수 있어요.</span>`;
      } else if (room.joined) {
        actionHtml = `<button class="leaveBtn">예약 취소</button>`;
      } else if (full) {
        // 예약 마감이면 참가 UI 숨김 (버튼 표시 X)
        actionHtml = ``;
      } else {
        actionHtml = `
          <input class="joinInput" value="${escapeHtml(savedNamejob)}" placeholder="참가 닉네임/직업 (예: 린엘/치유성)" />
          <button class="joinBtn">예약(참가)</button>
        `;
      }

      return `
        <div class="card ${isExpired ? "expired" : ""}" data-room="${room.id}">
          <div class="roomHeader">
            <div>
              <div class="roomTitle">
                ${statusPill}
                <b>${escapeHtml(room.dungeon)}</b>
                <b style="margin-left:10px;">${escapeHtml(formatTime(room.time))}</b>
              </div>
              <div class="muted roomMeta">
                정원: ${room.count}/${room.capacity}
              </div>
            </div>

            <!-- ✅ 순서: 참가 N명 → 공유 → 삭제 -->
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <span class="pill">참가 ${room.count}명</span>
              ${shareBtn}
              ${deleteBtn}
            </div>
          </div>

          <div class="joinRow">${actionHtml}</div>
          <div class="joinMsg"></div>

          <div class="muted" style="margin-top:10px;">참가자</div>
          <ul class="people">
            ${people.length ? people.map(p => `
              <li>
                ${escapeHtml(p.namejob)}
                ${p.isMe ? `<span class="meTag">나</span>` : ``}
              </li>
            `).join("") : `<li class="muted">아직 없음</li>`}
          </ul>
        </div>
      `;
    }).join("");

    root.querySelectorAll(".card[data-room]").forEach(card => {
      const roomId = card.getAttribute("data-room");
      const msgEl = card.querySelector(".joinMsg");

      // 링크 복사 / 공유
      const shareBtnEl = card.querySelector(".shareBtn");
      if (shareBtnEl) {
        shareBtnEl.addEventListener("click", async () => {
          setMsg(msgEl, "", "");
          const url = `${location.origin}/r/${roomId}`;
          try {
            if (navigator.share) {
              await navigator.share({ title: "파티 모집", url });
              setMsg(msgEl, "ok", "공유 완료!");
            } else {
              await navigator.clipboard.writeText(url);
              setMsg(msgEl, "ok", "링크 복사됨!");
            }
          } catch {
            try { prompt("이 링크를 복사해서 보내줘:", url); } catch {}
            setMsg(msgEl, "ok", "링크를 복사해서 공유해줘.");
          }
        });
      }

      // 참가
      const joinBtn = card.querySelector(".joinBtn");
      if (joinBtn) {
        const input = card.querySelector(".joinInput");
        input?.addEventListener("input", () => saveNamejob(input.value));

        joinBtn.addEventListener("click", async () => {
          const namejob = (input?.value || "").trim();
          setMsg(msgEl, "", "");
          if (!namejob) return setMsg(msgEl, "error", "닉네임/직업을 입력해줘.");

          saveNamejob(namejob);

          joinBtn.disabled = true;
          try {
            await api(`/api/rooms/${roomId}/join`, {
              method: "POST",
              body: JSON.stringify({ namejob })
            });
            setMsg(msgEl, "ok", "예약 완료!");
            await loadRooms();
          } catch (e) {
            setMsg(msgEl, "error", e.message);
          } finally {
            joinBtn.disabled = false;
          }
        });
      }

      // 예약 취소
      const leaveBtn = card.querySelector(".leaveBtn");
      if (leaveBtn) {
        leaveBtn.addEventListener("click", async () => {
          setMsg(msgEl, "", "");
          leaveBtn.disabled = true;
          try {
            await api(`/api/rooms/${roomId}/leave`, { method: "POST" });
            setMsg(msgEl, "ok", "예약 취소 완료!");
            await loadRooms();
          } catch (e) {
            setMsg(msgEl, "error", e.message);
          } finally {
            leaveBtn.disabled = false;
          }
        });
      }

      // 방 삭제: 방장이면 바로, 아니면 관리자키 입력해서 삭제
      const delBtn = card.querySelector(".deleteBtn");
      if (delBtn) {
        delBtn.addEventListener("click", async () => {
          setMsg(msgEl, "", "");
          if (!confirm("정말 이 방을 삭제할까?")) return;

          delBtn.disabled = true;
          try {
            await apiDeleteWithAdmin(`/api/rooms/${roomId}`);
            setMsg(msgEl, "ok", "삭제 완료!");
            await loadRooms();
          } catch (e) {
            setMsg(msgEl, "error", e.message);
          } finally {
            delBtn.disabled = false;
          }
        });
      }
    });
  }

  initTimePickers();

  const saved = loadSavedNamejob();
  if (saved && $("host")) $("host").value = saved;
  $("host")?.addEventListener("input", (e) => saveNamejob(e.target.value));

  $("goAllBtn")?.addEventListener("click", () => {
    history.pushState({}, "", "/");
    loadRooms();
  });

  $("createBtn").addEventListener("click", async () => {
    const dungeon = $("dungeon").value.trim();
    const host = $("host").value.trim();
    const cap = Number($("capacity").value);
    const msgEl = $("createMsg");

    setMsg(msgEl, "", "");

    const iso = getSelectedISO();
    if (!dungeon || !host || !iso) {
      return setMsg(msgEl, "error", "던전/날짜/시간/정원/닉네임·직업을 모두 입력해줘.");
    }
    if (!Number.isFinite(cap) || cap < 2 || cap > 20) {
      return setMsg(msgEl, "error", "정원은 2~20 사이로 입력해줘.");
    }

    saveNamejob(host);

    $("createBtn").disabled = true;
    try {
      await api("/api/rooms", {
        method: "POST",
        body: JSON.stringify({ dungeon, time: iso, host, capacity: cap })
      });
      $("dungeon").value = "";
      $("capacity").value = "4";
      setMsg(msgEl, "ok", "방 생성 완료!");
      await loadRooms();
    } catch (e) {
      setMsg(msgEl, "error", e.message);
    } finally {
      $("createBtn").disabled = false;
    }
  });

  loadRooms();

  $("refreshBtn")?.addEventListener("click", async () => {
    $("refreshBtn").disabled = true;
    try {
      await loadRooms();
    } finally {
      $("refreshBtn").disabled = false;
    }
  });
</script>
</body>
</html>
